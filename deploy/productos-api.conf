<VirtualHost *:80>
    ServerName api.tudominio.com

    DocumentRoot /var/www/productos-api/public
    <Directory /var/www/productos-api/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/productos-api-error.log
    CustomLog ${APACHE_LOG_DIR}/productos-api-access.log combined

    # Habilitar CORS en el VirtualHost
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Authorization, Content-Type"
    </IfModule>
</VirtualHost>