<VirtualHost *:80>
    ServerName tudominio.com

    DocumentRoot /var/www/productos-front/build

    <Directory /var/www/productos-front/build>
        AllowOverride All
        Require all granted
    </Directory>

    # React Router: redirigir rutas al index.html
    <IfModule mod_rewrite.c>
        RewriteEngine On
        //RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </IfModule>

    # Caché para archivos estáticos
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico)$">
        Header set Cache-Control "max-age=86400, public"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/productos-front-error.log
    CustomLog ${APACHE_LOG_DIR}/productos-front-access.log combined
</VirtualHost>